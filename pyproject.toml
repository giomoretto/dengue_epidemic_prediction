[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dengue_case_study"
version = "0.1.0"
description = "Weekly dengue incidence forecasts with backtested ML models and Monte-Carlo uncertainty"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giordano Moretto" }]
requires-python = ">=3.12"
# Tested versions as lower bounds, next major versions excluded
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=2.3,<3",
    "pyarrow>=24",
    "scikit-learn>=1.9,<2",
    "xgboost>=3.3,<4",
    "optuna>=4.9,<5",
    "plotly>=6.8,<7",
    "mlflow>=3.14,<4",
    "matplotlib>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["ipykernel", "seaborn"]

[tool.setuptools.packages.find]
include = ["utils*", "data_preparation*", "model_definition*", "model_synthesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
