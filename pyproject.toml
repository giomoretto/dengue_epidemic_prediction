[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dengue_case_study"
version = "0.1.0"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["utils*", "data_preparation*", "model_definition*", "model_synthesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]